<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="demo.css">
    <link rel="stylesheet" href="cardGira.css">
    <link rel="stylesheet" href="3dButton.css">
    <link rel="stylesheet" href="3dButton2.css">
    <link rel="stylesheet" href="ligaDesliga.css">
    <link rel="stylesheet" href="mais-menos.css">

    <title>UIverse</title>
</head>

<body>
    <h1>Demo teste de componentes UIverse</h1>
    <p>Testando inserir componentes aleatórios, gerando conflitos de CSS, para a Skynet se virar resolvendo</p>
    <hr>
    <h2>Botões</h2>
    <button type="button" class="button">
        <div class="button-top">3D Button</div>
        <div class="button-bottom"></div>
        <div class="button-base"></div>
    </button>

    <!-- <hr> -->
    <button>
        <span class="shadow"></span>
        <span class="edge"></span>
        <span class="front text"> Click me
        </span>
    </button>

    <hr>
    <h2>Seletores e checkboxes</h2>


    <label class="switch">
        <div class="round"><input name="onoff" id="onoff" type="checkbox">
            <div class="back"><label for="onoff" class="but"><span class="on">0</span><span class="off">I</span></label>
            </div>
        </div>
    </label>
    <!-- <hr> -->
    <div class="container">
        <div class="toggle">
            <input type="checkbox" />
            <span class="button"></span>
            <span class="label">+</span>
        </div>
        <div class="toggle">
            <input type="checkbox" checked="" />
            <span class="button"></span>
            <span class="label">–</span>
        </div>
    </div>

    <hr>
    <h2>Cards</h2>
    <div class="card">
        <p><span>O css deste</span></p>
        <p><span>Pode atrapalhar</span></p>
        <p><span>Outros elementos</span></p>
        <!-- <p><span>Outros elementos</span></p> -->
    </div>

    <hr>
    <h2>Inputs</h2>
    <!-- From Uiverse.io by 0xnihilism -->
    <div class="input__container">
        <div class="shadow__input"></div>
        <button class="input__button__shadow">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#000000" width="20px" height="20px">
                <path d="M0 0h24v24H0z" fill="none"></path>
                <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z">
                </path>
            </svg>
        </button>
        <input type="text" name="username" class="input__search" placeholder="Enter username" />
    </div>

    <!-- From Uiverse.io by Maximinodotpy --> 
<div class="inputGroup">
    <input type="text" required="" autocomplete="off">
    <label for="name">Name</label>
</div>

<!-- From Uiverse.io by Lakshay-art --> 
<div class="grid"></div>
<div id="poda">
  <div class="glow"></div>
  <div class="darkBorderBg"></div>
  <div class="darkBorderBg"></div>
  <div class="darkBorderBg"></div>

  <div class="white"></div>

  <div class="border"></div>

  <div id="main">
    <input placeholder="Search..." type="text" name="text" class="input" />
    <div id="input-mask"></div>
    <div id="pink-mask"></div>
    <div class="filterBorder"></div>
    <div id="filter-icon">
      <svg
        preserveAspectRatio="none"
        height="27"
        width="27"
        viewBox="4.8 4.56 14.832 15.408"
        fill="none"
      >
        <path
          d="M8.16 6.65002H15.83C16.47 6.65002 16.99 7.17002 16.99 7.81002V9.09002C16.99 9.56002 16.7 10.14 16.41 10.43L13.91 12.64C13.56 12.93 13.33 13.51 13.33 13.98V16.48C13.33 16.83 13.1 17.29 12.81 17.47L12 17.98C11.24 18.45 10.2 17.92 10.2 16.99V13.91C10.2 13.5 9.97 12.98 9.73 12.69L7.52 10.36C7.23 10.08 7 9.55002 7 9.20002V7.87002C7 7.17002 7.52 6.65002 8.16 6.65002Z"
          stroke="#d6d6e6"
          stroke-width="1"
          stroke-miterlimit="10"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></path>
      </svg>
    </div>
    <div id="search-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
        height="24"
        fill="none"
        class="feather feather-search"
      >
        <circle stroke="url(#search)" r="8" cy="11" cx="11"></circle>
        <line
          stroke="url(#searchl)"
          y2="16.65"
          y1="22"
          x2="16.65"
          x1="22"
        ></line>
        <defs>
          <linearGradient gradientTransform="rotate(50)" id="search">
            <stop stop-color="#f8e7f8" offset="0%"></stop>
            <stop stop-color="#b6a9b7" offset="50%"></stop>
          </linearGradient>
          <linearGradient id="searchl">
            <stop stop-color="#b6a9b7" offset="0%"></stop>
            <stop stop-color="#837484" offset="50%"></stop>
          </linearGradient>
        </defs>
      </svg>
    </div>
  </div>
</div>

<!-- From Uiverse.io by alexruix --> 
<div class="input-group">
  <input required="" type="text" name="text" autocomplete="off" class="input">
  <label class="user-label">First Name</label>
</div>

</body>

</html>
